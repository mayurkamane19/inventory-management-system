{% extends 'base.html' %}

{% block title %}Edit Customer - Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-4">
            <h4 class="fw-bold text-white mb-4"><i class="bi bi-pencil-square text-primary me-2"></i> Edit Customer</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">CUSTOMER NAME</label>
                    {{ form.name }}
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">PHONE</label>
                    {{ form.phone }}
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">EMAIL</label>
                    {{ form.email }}
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">ADDRESS</label>
                    {{ form.address }}
                </div>
                <div class="mt-4 text-end">
                    <a href="{% url 'contacts:customer_list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">Update Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
