{% extends 'base.html' %}

{% block title %}Create Purchase Order - Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-11">
        <div class="glass-card p-4">
            <h4 class="fw-bold text-white mb-4"><i class="bi bi-bag-plus text-primary me-2"></i> Create Purchase Order</h4>
            
            <form method="post" id="purchase-form">
                {% csrf_token %}
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label text-muted small fw-semibold">INVOICE NUMBER *</label>
                        <input type="text" name="invoice_no" class="form-control bg-dark text-white border-secondary" value="{{ auto_inv }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small fw-semibold">SUPPLIER *</label>
                        <select name="supplier" class="form-select bg-dark text-white border-secondary" required>
                            <option value="">Select Supplier</option>
                            {% for sup in suppliers %}
                                <option value="{{ sup.id }}">{{ sup.company|default:sup.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted small fw-semibold">PURCHASE DATE *</label>
                        <input type="datetime-local" name="purchase_date" class="form-control bg-dark text-white border-secondary" value="{{ now_str }}" required>
                    </div>
                </div>

                <h5 class="fw-bold text-white mb-3">Line Items</h5>
                <div class="table-responsive mb-3">
                    <table class="table custom-table" id="items-table">
                        <thead>
                            <tr>
                                <th style="width: 45%;">Product</th>
                                <th style="width: 20%;">Quantity</th>
                                <th style="width: 25%;">Unit Purchase Price (₹)</th>
                                <th style="width: 10%;" class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <select name="product_id[]" class="form-select bg-dark text-white border-secondary product-select" required>
                                        <option value="">Select Product</option>
                                        {% for prod in products %}
                                            <option value="{{ prod.id }}" data-price="{{ prod.unit_price }}">{{ prod.name }} (SKU: {{ prod.sku }})</option>
                                        {% endfor %}
                                    </select>
                                </td>
                                <td>
                                    <input type="number" name="quantity[]" class="form-control bg-dark text-white border-secondary" min="1" value="1" required>
                                </td>
                                <td>
                                    <input type="number" name="purchase_price[]" class="form-control bg-dark text-white border-secondary price-input" step="0.01" value="0.00" required>
                                </td>
                                <td class="text-end">
                                    <button type="button" class="btn btn-outline-danger btn-sm remove-row-btn"><i class="bi bi-trash-fill"></i></button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <button type="button" class="btn btn-outline-primary btn-sm mb-4" id="add-row-btn"><i class="bi bi-plus-circle me-1"></i> Add Another Item</button>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-semibold">ORDER NOTES</label>
                    <textarea name="notes" class="form-control bg-dark text-white border-secondary" rows="2" placeholder="Optional notes..."></textarea>
                </div>

                <div class="text-end">
                    <a href="{% url 'transactions:purchase_list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4"><i class="bi bi-check-circle me-1"></i> Submit Purchase & Update Stock</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const tableBody = document.querySelector('#items-table tbody');
    const addRowBtn = document.getElementById('add-row-btn');

    addRowBtn.addEventListener('click', () => {
        const firstRow = tableBody.querySelector('tr');
        const newRow = firstRow.cloneNode(true);
        newRow.querySelector('select').value = '';
        newRow.querySelector('input[type="number"]').value = '1';
        newRow.querySelector('.price-input').value = '0.00';
        tableBody.appendChild(newRow);
    });

    tableBody.addEventListener('click', (e) => {
        if (e.target.closest('.remove-row-btn')) {
            if (tableBody.querySelectorAll('tr').length > 1) {
                e.target.closest('tr').remove();
            }
        }
    });

    tableBody.addEventListener('change', (e) => {
        if (e.target.classList.contains('product-select')) {
            const selectedOption = e.target.options[e.target.selectedIndex];
            const defaultPrice = selectedOption.getAttribute('data-price') || '0.00';
            const priceInput = e.target.closest('tr').querySelector('.price-input');
            priceInput.value = defaultPrice;
        }
    });
});
</script>
{% endblock %}
