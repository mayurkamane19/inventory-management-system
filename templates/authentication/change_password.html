{% extends 'base.html' %}

{% block title %}Change Password - Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-4">
            <h5 class="fw-bold text-white mb-4"><i class="bi bi-key-fill text-warning me-2"></i> Change Account Password</h5>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">{{ field.label|upper }}</label>
                        <input type="{{ field.widget_type }}" name="{{ field.name }}" class="form-control bg-dark text-white border-secondary" required>
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="mt-4 d-flex justify-content-between align-items-center">
                    <a href="{% url 'authentication:profile' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-warning fw-bold px-4"><i class="bi bi-shield-lock me-2"></i> Update Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
