{% extends 'base.html' %}

{% block title %}Forgot Password - Inventory System{% endblock %}

{% block auth_content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 bg-dark">
    <div class="card glass-card p-4 p-md-5 border-secondary shadow-lg" style="max-width: 440px; width: 100%;">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-25 text-warning mb-3">
                <i class="bi bi-shield-lock-fill fs-1"></i>
            </div>
            <h4 class="fw-bold text-white">Reset Password</h4>
            <p class="text-muted small">Enter your registered email address to receive password reset instructions.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="email" class="form-label text-muted small fw-semibold">EMAIL ADDRESS</label>
                <input type="email" name="email" id="email" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="name@company.com" required>
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-warning btn-lg fw-bold text-dark">Send Reset Link</button>
            </div>
            <div class="text-center mt-3">
                <a href="{% url 'authentication:login' %}" class="small text-muted text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
