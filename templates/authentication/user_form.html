{% extends 'base.html' %}

{% block title %}Add New User - Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="glass-card p-4">
            <h4 class="fw-bold text-white mb-4"><i class="bi bi-person-plus-fill text-primary me-2"></i> Create New User Account</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">USERNAME</label>
                        {{ form.username }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">ROLE</label>
                        {{ form.role }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">FIRST NAME</label>
                        {{ form.first_name }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">LAST NAME</label>
                        {{ form.last_name }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">EMAIL ADDRESS</label>
                        {{ form.email }}
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">PASSWORD</label>
                        {{ form.password }}
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <a href="{% url 'authentication:user_list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4 fw-bold"><i class="bi bi-check-lg me-1"></i> Create User</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
