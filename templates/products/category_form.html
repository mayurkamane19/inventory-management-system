{% extends 'base.html' %}

{% block title %}Edit Category - Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="glass-card p-4">
            <h4 class="fw-bold text-white mb-4"><i class="bi bi-pencil-square text-primary me-2"></i> Edit Category: {{ category.name }}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">CATEGORY NAME</label>
                    {{ form.name }}
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">STATUS</label>
                    {{ form.status }}
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">DESCRIPTION</label>
                    {{ form.description }}
                </div>
                <div class="mt-4 text-end">
                    <a href="{% url 'products:category_list' %}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">Update Category</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
