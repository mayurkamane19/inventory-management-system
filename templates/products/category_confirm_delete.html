{% extends 'base.html' %}

{% block title %}Delete Category - Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="glass-card p-4 text-center">
            <i class="bi bi-exclamation-triangle-fill text-warning fs-1 mb-3"></i>
            <h4 class="fw-bold text-white mb-2">Delete Category?</h4>
            <p class="text-muted">Are you sure you want to delete category <strong class="text-white">"{{ category.name }}"</strong>? Products linked to this category may be affected.</p>
            <form method="post" class="mt-4">
                {% csrf_token %}
                <a href="{% url 'products:category_list' %}" class="btn btn-outline-secondary px-4 me-2">Cancel</a>
                <button type="submit" class="btn btn-danger fw-bold px-4">Confirm Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
